<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1f"/>
      <stop offset="100%" stop-color="#0d1230"/>
    </linearGradient>
    <linearGradient id="leftWing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00c8ff"/>
      <stop offset="100%" stop-color="#4a6cf7"/>
    </linearGradient>
    <linearGradient id="rightWing" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c5ce8"/>
      <stop offset="100%" stop-color="#4a6cf7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="128" height="128" rx="22" fill="url(#bgGrad)"/>

  <!-- Subtle circle ring -->
  <circle cx="64" cy="56" r="38" fill="none" stroke="#2a3a6a" stroke-width="1" opacity="0.6"/>

  <!-- Left wing of W -->
  <path d="M20 32 L44 72 L56 56 L64 72 L44 88 L20 48 Z"
        fill="url(#leftWing)" filter="url(#glow)" opacity="0.95"/>

  <!-- Right wing of W -->
  <path d="M108 32 L84 72 L72 56 L64 72 L84 88 L108 48 Z"
        fill="url(#rightWing)" filter="url(#glow)" opacity="0.95"/>

  <!-- Center navigation arrow (white) -->
  <path d="M64 26 L76 62 L64 54 L52 62 Z"
        fill="white" opacity="0.95"/>

  <!-- Arrow stem -->
  <rect x="61" y="54" width="6" height="22" rx="2" fill="white" opacity="0.85"/>
</svg>
